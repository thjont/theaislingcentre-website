baseURL = 'https://theaislingcentre.com/'
locale = 'en-us'
defaultContentLanguage = 'en'
title = 'Aisling Centre'
theme = 'hugo-universal-theme'

summaryLength = 70
pluralizelisttitles = false

[pagination]
    pagerSize = 10

[taxonomies]
    category = 'categories'
    tag = 'tags'

[permalinks]
    # news stays at /news/<slug>/ (no date in the URL), matching the old site's flat permalinks
    news = '/news/:slugorfilename/'

[params]
    author = "Aisling Centre"
    defaultDescription = "The Aisling Centre is a professional counselling & psychotherapy service based in Enniskillen, Northern Ireland."
    mainSections = ["news"]

    logo_text = "Aisling Centre"
    disabled_logo = false
    contact_url = "/contact/"

    style = "default"

    date_format = "January 2, 2006"
    dropdown_mouse_over = true

[params.topbar]
    enable = false

[params.widgets]
    categories = true
    tags = true
    search = false

[params.carouselHomepage]
    enable = false

[params.testimonials]
    enable = false

[params.clients]
    enable = false

[params.see_more]
    enable = false

[params.recent_posts]
    enable = true
    title = "Latest News"

[params.footer.recent_posts]
    enable = true

